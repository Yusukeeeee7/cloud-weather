name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

# 同じきっかけ（main・タグ）は 1 つずつ実行する。push の途中で止めないように、実行中のものは止めない。
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ジョブで指定すると、書かなかった権限は none になる。contents も書く。
    permissions:
      contents: read
      packages: write
      # 来歴・SBOM の attestation（#22）。id-token は Sigstore の証明書をもらう OIDC トークン。
      # docker run のコンテナには環境変数を渡していないので、スモークテスト・Trivy のコンテナからは使えない。
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker build
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag cloud-weather:cd .

      # 外部と通信できない状態で起動する。ホストからは届かないので、
      # 同じイメージの別のコンテナをネットワークを共有させて、その中でスモークテストを実行する。
      - name: Start container
        run: docker run --detach --name api --network none cloud-weather:cd

      - name: Smoke test
        run: |
          docker run --rm --network container:api \
            --volume "${GITHUB_WORKSPACE}/scripts:/scripts:ro" \
            cloud-weather:cd python /scripts/smoke_test.py

      # 動いている API への攻撃の検査（DAST、#23）。ZAP は API のコンテナのネットワーク（--network none）を
      # 共有するので、127.0.0.1 の API にしか届かない。トークン・環境変数は渡さない。
      # ZAP は重さに関係なくすべての警告を WARN（終了コード 2）にするので、0・2 は受け入れ、
      # High の判定は JSON のレポートを読む scripts/zap_high_alerts.py で行う。1（FAIL）・3（ZAP の失敗）は失敗。
      # ZAP は定義から URL を取り込めなくても止まらない（ログに件数を出すだけ）ので、
      # 出力の「Number of Imported URLs: N」の N が少なければ失敗にする（説明書を受け取っただけで通さない）。
      # 8 は /openapi.json に載っている道の数（docs/dast.md）。道を減らしたら合わせる。
      # docker run のイメージなので、Dependabot はこの行を更新しない（Trivy と同じ）。
      # レポートのフォルダは、イメージの zap ユーザーが書けるようにする（runner のユーザーとは別）。
      # 判定はテストと同じ Python で動かすため、API のイメージの中で外部と通信させずに実行する。
      - name: DAST (ZAP API scan)
        run: |
          min_imported_urls=8
          mkdir -p "${RUNNER_TEMP}/zap"
          chmod 777 "${RUNNER_TEMP}/zap"
          zap_output="${RUNNER_TEMP}/zap-output.txt"
          zap_status=0
          docker run --rm --network container:api \
            --volume "${RUNNER_TEMP}/zap:/zap/wrk:rw" \
            --volume "${GITHUB_WORKSPACE}/.zap:/zap/config:ro" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
            zap-api-scan.py -t http://127.0.0.1:8000/openapi.json -f openapi \
            -c /zap/config/api-scan.conf -J zap-report.json -s \
            > "$zap_output" 2>&1 || zap_status=$?
          cat "$zap_output"
          if [[ "$zap_status" != 0 && "$zap_status" != 2 ]]; then
            echo "ZAP API scan failed with exit code ${zap_status}" >&2
            exit 1
          fi
          imported="$(sed -nE 's/.*Number of Imported URLs: ([0-9]+).*/\1/p' "$zap_output" | tail -n 1)"
          if [[ -z "$imported" ]] || (( imported < min_imported_urls )); then
            echo "ZAP imported too few URLs: '${imported}' (expected at least ${min_imported_urls})" >&2
            exit 1
          fi
          docker run --rm --network none \
            --volume "${GITHUB_WORKSPACE}/scripts:/scripts:ro" \
            --volume "${RUNNER_TEMP}/zap:/report:ro" \
            cloud-weather:cd python /scripts/zap_high_alerts.py /report/zap-report.json

      - name: Show container logs
        if: failure()
        run: docker logs api

      # イメージの中の脆弱性の検査（#21）。ci.yml の同じ名前の手順と同じ（イメージの名前だけ違う）。
      # 修正版のある HIGH・CRITICAL が 1 件でもあれば失敗し、push しない。
      - name: Trivy DB
        run: |
          docker run --rm \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache" \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --download-db-only --skip-version-check --disable-telemetry --no-progress

      - name: Trivy (image)
        run: |
          docker save cloud-weather:cd --output "${RUNNER_TEMP}/image.tar"
          docker run --rm --network none \
            --volume "${RUNNER_TEMP}/image.tar:/scan/image.tar:ro" \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache" \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /scan/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-db-update --offline-scan --skip-version-check --disable-telemetry --no-progress

      # 検査に通ったのと同じ tar から SBOM（部品表、SPDX 2.3 の JSON）を作る（#22）。
      # SBOM を作るだけなら脆弱性のデータベースは要らず、外部と通信しない。作れなければ push しない。
      - name: SBOM
        run: |
          mkdir -p "${RUNNER_TEMP}/sbom"
          docker run --rm --network none \
            --volume "${RUNNER_TEMP}/image.tar:/scan/image.tar:ro" \
            --volume "${RUNNER_TEMP}/sbom:/sbom" \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /scan/image.tar --format spdx-json --output /sbom/sbom.spdx.json \
            --skip-version-check --disable-telemetry --no-progress

      # ここから先は、スモークテストと Trivy の検査が通ったときだけ実行される。
      # Trivy は docker login より前に実行する（ログインの情報が残った Docker で検査のコンテナを動かさない）。
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # テストしたイメージにタグを付けて push する（作り直さない）。
      # イメージ名は小文字だけ（持ち主の名前に大文字があるので変換する）。
      # push した後、レジストリに置かれたイメージの digest を問い合わせて、attest の手順に渡す（#22）。
      - name: Push image
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloud-weather"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9A-Za-z._-]{1,127}$ ]]; then
              echo "tag name is not usable as an image tag" >&2
              exit 1
            fi
            tags=("$GITHUB_REF_NAME")
          else
            tags=("latest" "sha-${GITHUB_SHA::7}")
          fi
          for tag in "${tags[@]}"; do
            docker tag cloud-weather:cd "${image}:${tag}"
            docker push "${image}:${tag}"
          done
          digest="$(docker buildx imagetools inspect "${image}:${tags[0]}" --format '{{.Manifest.Digest}}')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "pushed image digest is not usable" >&2
            exit 1
          fi
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # ビルドの来歴と SBOM を、Sigstore で署名してイメージの隣（ghcr.io）に置く（#22）。
      # 公式の例と同じく、ログインした後・ログアウトの前に実行する（レジストリへの認証のしかたは README に書かれていない）。
      # push の後に失敗すると、署名のないイメージが push 済みになる（digest はレジストリから取るので、push の前には動かせない）。
      # そのときは CD を再実行して付け直す。
      # storage record は組織のリポジトリでしか作れないので作らない。
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
