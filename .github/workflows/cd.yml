name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

# 同じきっかけ（main・タグ）は 1 つずつ実行する。push の途中で止めないように、実行中のものは止めない。
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ジョブで指定すると、書かなかった権限は none になる。contents も書く。
    permissions:
      contents: read
      packages: write
      # 来歴・SBOM の attestation（#22）。id-token は Sigstore の証明書をもらう OIDC トークン。
      # Actions の手順にだけ届く（docker run のコンテナには環境変数を渡さない）。
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker build
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag cloud-weather:cd .

      # 外部と通信できない状態で起動する。ホストからは届かないので、
      # 同じイメージの別のコンテナをネットワークを共有させて、その中でスモークテストを実行する。
      - name: Start container
        run: docker run --detach --name api --network none cloud-weather:cd

      - name: Smoke test
        run: |
          docker run --rm --network container:api \
            --volume "${GITHUB_WORKSPACE}/scripts:/scripts:ro" \
            cloud-weather:cd python /scripts/smoke_test.py

      - name: Show container logs
        if: failure()
        run: docker logs api

      # イメージの中の脆弱性の検査（#21）。ci.yml の同じ名前の手順と同じ（イメージの名前だけ違う）。
      # 修正版のある HIGH・CRITICAL が 1 件でもあれば失敗し、push しない。
      - name: Trivy DB
        run: |
          docker run --rm \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache" \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --download-db-only --skip-version-check --disable-telemetry --no-progress

      - name: Trivy (image)
        run: |
          docker save cloud-weather:cd --output "${RUNNER_TEMP}/image.tar"
          docker run --rm --network none \
            --volume "${RUNNER_TEMP}/image.tar:/scan/image.tar:ro" \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache" \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /scan/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-db-update --offline-scan --skip-version-check --disable-telemetry --no-progress

      # 検査に通ったのと同じ tar から SBOM（部品表、SPDX 2.3 の JSON）を作る（#22）。
      # SBOM を作るだけなら脆弱性のデータベースは要らず、外部と通信しない。作れなければ push しない。
      - name: SBOM
        run: |
          mkdir -p "${RUNNER_TEMP}/sbom"
          docker run --rm --network none \
            --volume "${RUNNER_TEMP}/image.tar:/scan/image.tar:ro" \
            --volume "${RUNNER_TEMP}/sbom:/sbom" \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /scan/image.tar --format spdx-json --output /sbom/sbom.spdx.json \
            --skip-version-check --disable-telemetry --no-progress

      # ここから先は、スモークテストと Trivy の検査が通ったときだけ実行される。
      # Trivy は docker login より前に実行する（ログインの情報が残った Docker で検査のコンテナを動かさない）。
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # テストしたイメージにタグを付けて push する（作り直さない）。
      # イメージ名は小文字だけ（持ち主の名前に大文字があるので変換する）。
      # push した後、レジストリに置かれたイメージの digest を問い合わせて、attest の手順に渡す（#22）。
      - name: Push image
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloud-weather"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9A-Za-z._-]{1,127}$ ]]; then
              echo "tag name is not usable as an image tag" >&2
              exit 1
            fi
            tags=("$GITHUB_REF_NAME")
          else
            tags=("latest" "sha-${GITHUB_SHA::7}")
          fi
          for tag in "${tags[@]}"; do
            docker tag cloud-weather:cd "${image}:${tag}"
            docker push "${image}:${tag}"
          done
          digest="$(docker buildx imagetools inspect "${image}:${tags[0]}" --format '{{.Manifest.Digest}}')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "pushed image digest is not usable" >&2
            exit 1
          fi
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # ビルドの来歴と SBOM を、Sigstore で署名してイメージの隣（ghcr.io）に置く（#22）。
      # docker login の情報で push するので、ログアウトより前に実行する。
      # storage record は組織のリポジトリでしか作れないので作らない。
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
