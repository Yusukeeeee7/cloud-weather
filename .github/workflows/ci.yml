name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks が全履歴を検査するため、すべてのコミットを取得する。
          fetch-depth: 0

      # シークレットが入っていたら、ほかの手順のログを出す前に止める。
      # --redact で、見つかった値をログに出さない。外部と通信させない。
      # docker run のイメージなので、Dependabot はこの行を更新しない（版と digest は手で上げる）。
      - name: Gitleaks (full history)
        run: |
          set -o pipefail
          # 浅い履歴では古いコミットを見ずに通ってしまうので、先に止める。
          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo "not a full git history (shallow or not a git repository); gitleaks needs the full history" >&2
            exit 1
          fi
          docker run --rm --network none \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --verbose /repo 2>&1 | tee "${RUNNER_TEMP}/gitleaks.log"
          # git が失敗しても gitleaks は 0 で終わる（v8.30.1 で確かめた）ので、ERR の行があれば失敗にする。
          # ログには色の制御文字が付くので、消してから「時刻 ERR」で始まる行を探す。
          if sed 's/\x1b\[[0-9;]*m//g' "${RUNNER_TEMP}/gitleaks.log" | grep -qE '^[^ ]+ ERR '; then
            echo "gitleaks reported an error" >&2
            exit 1
          fi

      # ワークフローと Dockerfile の書き方の検査（#20）。依存のインストールが要らず速いので、前に置く。
      # どれも公式のイメージを版と digest で固定し、外部と通信させず、リポジトリを読み取り専用で載せる。
      # docker run のイメージなので、Dependabot はこれらの行を更新しない（版と digest は手で上げる）。
      # actionlint は git のリポジトリの中でワークフローを探す（見つからないと終了コード 3）。
      # shellcheck もイメージに入っていて、run: のスクリプトも検査する。
      - name: Actionlint (workflows)
        run: |
          docker run --rm --network none \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      # トークンを渡さず --offline で動かす（GitHub の API を使う監査は動かない）。
      # 指摘があると終了コード 11〜14 で失敗する。
      # 版は、出たばかりの 1.31.x を避けて 1.30.1（2026-09-09 公開）にした（#20）。
      - name: Zizmor (workflows)
        run: |
          docker run --rm --network none \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            --offline /repo/.github/workflows

      # 既定の --failure-threshold（info）のまま、info 以上の指摘で失敗する。
      - name: Hadolint (Dockerfiles)
        run: |
          docker run --rm --network none \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" --workdir /repo \
            ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint Dockerfile Dockerfile.dev

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Dockerfile の uv のバージョンと合わせる（Dependabot はこの行を更新しない）。
          version: "0.13.0"

      # 速く終わるものから順に実行する。途中で失敗したら後続は実行されない。
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app ml

      - name: Pytest (coverage)
        run: uv run pytest --cov=app --cov=ml

      # サンプルデータ（tests/fixtures/data_raw/）で実行する。外部とは通信しない。
      - name: Notebooks (nbmake)
        run: uv run pytest --nbmake notebooks/

      - name: pip-audit
        run: uv run pip-audit --progress-spinner off

      - name: Docker build
        run: docker build --tag cloud-weather:ci .

      # イメージの中の脆弱性の検査（#21）。修正版のある HIGH・CRITICAL が 1 件でもあれば失敗する。
      # 公式のイメージを版と digest で固定する（trivy-action は 2026 年 3 月にタグを付け替えられたので使わない）。
      # docker run のイメージなので、Dependabot はこれらの行を更新しない（版と digest は手で上げる）。
      # 脆弱性のデータベースだけは、この手順で取得する（mirror.gcr.io、取れなければ ghcr.io）。
      - name: Trivy DB
        run: |
          docker run --rm \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache" \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --download-db-only --skip-version-check --disable-telemetry --no-progress

      # 検査は外部と通信させない。Docker のソケットは渡さず、イメージを tar にして読み取り専用で渡す。
      # --exit-code 1 がないと、指摘があっても 0 で終わる（#21 で確かめた）。
      # データベースがないときは --skip-db-update で失敗する（素通りしない。#21 で確かめた）。
      - name: Trivy (image)
        run: |
          docker save cloud-weather:ci --output "${RUNNER_TEMP}/image.tar"
          docker run --rm --network none \
            --volume "${RUNNER_TEMP}/image.tar:/scan/image.tar:ro" \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache" \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /scan/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-db-update --offline-scan --skip-version-check --disable-telemetry --no-progress
