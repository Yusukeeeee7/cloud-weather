[project]
name = "cloud-weather"
version = "0.1.0"
description = "天気取得APIと雲底高度予測モデル"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
