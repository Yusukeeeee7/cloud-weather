<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cloud-weather</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <h1>cloud-weather</h1>
    <nav class="cities" aria-label="都市">
      <button type="button" data-city="tokyo" aria-pressed="true">東京</button>
      <button type="button" data-city="berlin" aria-pressed="false">ベルリン</button>
    </nav>
  </header>
  <p id="notice" class="notice" hidden></p>

  <main>
    <section class="card" aria-labelledby="current-title">
      <h2 id="current-title">現在</h2>
      <div id="current" class="tiles" aria-live="polite"></div>
    </section>

    <section class="card" aria-labelledby="cloud-base-title">
      <h2 id="cloud-base-title">雲底（シーリング）</h2>
      <div id="cloud-base" class="tiles"></div>
    </section>

    <section class="card" aria-labelledby="daylight-title">
      <h2 id="daylight-title">日照</h2>
      <div id="daylight" class="tiles"></div>
    </section>

    <section class="card wide" aria-labelledby="history-title">
      <h2 id="history-title">過去 24 時間の雲量</h2>
      <div id="history">
        <div class="history-head">
          <output id="history-time" for="history-slider"></output>
          <span id="history-values" class="history-values"></span>
        </div>
        <svg id="history-sky" class="sky" viewBox="0 0 320 180" role="img" aria-label="選んだ時刻の雲の様子"></svg>
        <input id="history-slider" type="range" min="0" max="23" step="1" value="23" aria-label="時刻を選ぶ（過去 24 時間）">
        <svg id="history-line" class="line" viewBox="0 0 320 60" role="img" aria-label="全体の雲量の推移"></svg>
        <p class="note">過去の値は Open-Meteo の過去の予報の保存値で、観測値ではありません。</p>
      </div>
      <p id="history-error" class="error" hidden></p>
    </section>

    <section class="card wide" aria-labelledby="hourly-title">
      <h2 id="hourly-title">24 時間の予報</h2>
      <div class="scroll"><table id="hourly"></table></div>
    </section>

    <section class="card wide" aria-labelledby="daily-title">
      <h2 id="daily-title">7 日間の予報</h2>
      <div class="scroll"><table id="daily"></table></div>
    </section>
  </main>

  <footer class="foot">
    <a href="https://open-meteo.com/">Weather data by Open-Meteo.com</a>（CC BY 4.0）
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
